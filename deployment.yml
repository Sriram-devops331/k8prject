apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2

  selector:
    matchLabels:
      app: niginx

  template:
    metadata:
      labels:
        app: niginx

    spec:
      containers:
        - name: cont1
          image: sriramduvvuru/kuberfirst:appimage

          ports:
            - containerPort: 80

          # ConfigMap integration
          envFrom:
            - configMapRef:
                name: bankapp-config

          # Resource-quota integration
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
